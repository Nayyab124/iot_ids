
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-ids"
version = "0.1.0"
description = "Modular IoT intrusion detection and prevention system"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
